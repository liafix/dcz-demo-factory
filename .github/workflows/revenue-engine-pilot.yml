name: DCZ Revenue Engine — pilot validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'factory/**'
      - 'tests/**'
      - 'fixtures/**'
      - '.github/workflows/revenue-engine-pilot.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Unit tests — fail closed, no external calls
        run: python -m unittest discover -s tests -v
      - name: Reproducible offline pilot
        run: |
          python -m factory.worker --stage dry-run --input fixtures/synthetic-lead.json --output /tmp/dcz-pilot
          test -f /tmp/dcz-pilot/demos/modelove-studio-testovacie-mesto/index.html
          grep -q 'noindex,nofollow' /tmp/dcz-pilot/demos/modelove-studio-testovacie-mesto/index.html
